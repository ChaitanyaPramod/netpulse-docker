name: Build and Publish NetPulse Image

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_lc
        run: |
          # Convert github.repository_owner to lowercase for Docker compliance
          IMAGE_LOWER=$(echo "${{ github.repository_owner }}/netpulse" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_LOWER}" >> $GITHUB_OUTPUT

      - name: Get upstream release tag
        id: upstream
        run: |
          TAG_NAME=$(curl -sSL https://api.github.com/repos/gnacho/netpulse/releases/latest | jq -r .tag_name)
          SEM_VER="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$SEM_VER" >> $GITHUB_OUTPUT

      - name: Check if image tag exists in GHCR
        id: check_tag
        run: |
          IMAGE_TAG="${{ steps.upstream.outputs.tag }}"
          IMAGE_NAME="${{ steps.repo_lc.outputs.image_name }}"
          
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull" | jq -r .token)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${IMAGE_TAG}")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Image for tag $IMAGE_TAG already exists in GHCR. Skipping build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image for tag $IMAGE_TAG does not exist. Proceeding with build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.upstream.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_lc.outputs.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo_lc.outputs.image_name }}:${{ steps.upstream.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.repo_lc.outputs.image_name }}:${{ steps.upstream.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo_lc.outputs.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo_lc.outputs.image_name }}:buildcache,mode=max
